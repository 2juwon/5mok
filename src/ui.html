<title>한판 오목</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gothic+A1:wght@400;600;800&display=swap">
<style>
/* 레이아웃: 한 화면 앱. 시작 화면(설정 한 줄 기둥) ↔ 대국 화면(넓으면 판 | 옆 패널, 좁으면 위 띠 / 판 / 아래 버튼) */
:root {
  --bg: #e3e7df; --panel: #f4f6f1; --fg: #1c211e; --muted: #5d6960; --line: #cad1c6;
  --wood: #dcae62; --wood-hi: #e8c27e; --wood-ink: #4e3416; --accent: #b2362b; --accent-fg: #fff;
  --ok: #2f6b45; --chip: #e9ede5;
  --f-display: "Do Hyeon", "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-body: "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --r: 12px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #131714; --panel: #1c211d; --fg: #e4e9e1; --muted: #93a096; --line: #2e372f;
  --wood: #c79855; --wood-hi: #d6a865; --wood-ink: #3a260e; --accent: #e2675a; --accent-fg: #1a0d0b;
  --ok: #7cc495; --chip: #252c26; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #131714; --panel: #1c211d; --fg: #e4e9e1; --muted: #93a096; --line: #2e372f;
  --wood: #c79855; --wood-hi: #d6a865; --wood-ink: #3a260e; --accent: #e2675a; --accent-fg: #1a0d0b;
  --ok: #7cc495; --chip: #252c26; color-scheme: dark }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.5;
  -webkit-tap-highlight-color: transparent; }
button, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

/* ── 시작 화면 ── */
#setup { min-height: 100%; padding-block: 28px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.col { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.brand { display: flex; align-items: center; gap: 16px; }
.brand svg { flex: none; width: 72px; height: 72px; }
.brand h1 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 44px; line-height: 1; letter-spacing: -0.5px; }
.brand p { margin: 6px 0 0; color: var(--muted); }
section.group { display: flex; flex-direction: column; gap: 10px; }
.lab { font-family: var(--f-display); font-size: 20px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.lab small { font-family: var(--f-body); font-size: 13px; color: var(--muted); }
.levels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.lv { text-align: left; background: var(--panel); border: 1.5px solid var(--line); border-radius: var(--r); padding: 12px 12px 10px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.lv b { font-family: var(--f-display); font-weight: 400; font-size: 24px; display: flex; align-items: center; gap: 8px; flex: none; white-space: nowrap; }
.lv .dots { display: inline-flex; gap: 3px; }
.lv .dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.lv .dots i.on { background: var(--fg); }
.lv span { font-size: 13px; color: var(--muted); line-height: 1.35; }
.lv em { font-style: normal; font-size: 12px; color: var(--muted); margin-top: 2px; }
.lv[aria-pressed="true"] { border-color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg); }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { background: var(--panel); border: 1.5px solid var(--line); border-radius: 999px; padding: 7px 14px; display: inline-flex; align-items: center; gap: 7px; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.stone-ico { width: 14px; height: 14px; border-radius: 50%; display: inline-block; flex: none; }
.stone-ico.b { background: radial-gradient(circle at 35% 30%, #666, #111 60%); }
.stone-ico.w { background: radial-gradient(circle at 35% 30%, #fff, #cfcfc6 75%); box-shadow: inset 0 0 0 1px rgba(0,0,0,.25); }
.desc { margin: 0; font-size: 13.5px; color: var(--muted); }
.custom { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; background: var(--panel); border: 1.5px solid var(--line); border-radius: var(--r); padding: 12px; }
.custom label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
.custom select { padding: 7px 8px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--bg); color: var(--fg); }
.toggles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 14px; }
.tg { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.tg span { font-size: 14px; }
.sw { width: 42px; height: 24px; border-radius: 12px; border: none; background: var(--line); position: relative; flex: none; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--panel); transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
.sw[aria-pressed="true"] { background: var(--ok); }
.sw[aria-pressed="true"]::after { transform: translateX(18px); }
.starts { display: flex; gap: 10px; flex-wrap: wrap; }
.big { font-family: var(--f-display); font-size: 22px; border: none; border-radius: var(--r); padding: 12px 26px; background: var(--fg); color: var(--bg); }
.big.alt { background: transparent; color: var(--fg); box-shadow: inset 0 0 0 1.5px var(--fg); }
.foot { font-size: 12.5px; color: var(--muted); margin: 0; }

/* ── 대국 화면 ── */
#play { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 18px; padding-block: 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); box-sizing: border-box; }
#boardArea { min-width: 0; min-height: 0; display: flex; align-items: center; justify-content: center; position: relative; }
#boardBox { position: relative; }
#board { display: block; width: 100%; height: 100%; touch-action: manipulation; user-select: none; -webkit-user-select: none; border-radius: 6px;
  box-shadow: 0 1px 0 rgba(255,255,255,.25) inset, 0 10px 30px rgba(30,20,5,.28), 0 2px 4px rgba(30,20,5,.25); }
#side { display: flex; flex-direction: column; gap: 14px; min-width: 0; min-height: 0; }
.players { display: flex; flex-direction: column; gap: 8px; }
.pl { display: flex; align-items: center; gap: 10px; background: var(--panel); border: 1.5px solid var(--line); border-radius: var(--r); padding: 10px 12px; }
.pl .stone-ico { width: 22px; height: 22px; }
.pl div { display: flex; flex-direction: column; min-width: 0; }
.pl b { font-family: var(--f-display); font-weight: 400; font-size: 19px; line-height: 1.15; }
.pl small { color: var(--muted); font-size: 12.5px; }
.pl.turn { border-color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg); }
.pl .think { margin-left: auto; display: none; gap: 3px; }
.pl.thinking .think { display: inline-flex; }
.think i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: bob 1s infinite ease-in-out; }
.think i:nth-child(2) { animation-delay: .15s } .think i:nth-child(3) { animation-delay: .3s }
@keyframes bob { 0%,100% { transform: translateY(0); opacity: .4 } 50% { transform: translateY(-4px); opacity: 1 } }
#status { font-family: var(--f-display); font-size: 21px; line-height: 1.25; min-height: 2.5em; margin: 0; }
#status small { display: block; font-family: var(--f-body); font-size: 13px; color: var(--muted); }
.ctrl { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.ctrl button { background: var(--panel); border: 1.5px solid var(--line); border-radius: var(--r); padding: 10px 8px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px; }
.ctrl button:disabled { opacity: .45; cursor: default; }
.ctrl button.warn { border-color: var(--accent); color: var(--accent); }
.ruleinfo { font-size: 13px; color: var(--muted); background: var(--chip); border-radius: var(--r); padding: 10px 12px; }
.ruleinfo b { color: var(--fg); font-weight: 600; }
#toast { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 7px 14px; border-radius: 999px; font-size: 14px; font-weight: 600; pointer-events: none; opacity: 0; transition: opacity .2s; white-space: nowrap; z-index: 3; }
#toast.on { opacity: 1; }
#result { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 4; }
#result .card { background: var(--panel); border-radius: 16px; padding: 22px 22px 18px; width: min(320px, 88%); text-align: center; box-shadow: 0 16px 40px rgba(0,0,0,.3); display: flex; flex-direction: column; gap: 12px; animation: pop .35s cubic-bezier(.2,1.4,.4,1); }
@keyframes pop { from { transform: scale(.88) } }
#result h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 40px; line-height: 1; }
#result p { margin: 0; color: var(--muted); font-size: 14px; }
#result .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
#result button { border: none; border-radius: 10px; padding: 9px 14px; font-weight: 600; background: var(--chip); }
#result button.main { background: var(--fg); color: var(--bg); }
.seal { width: 64px; height: 64px; margin: 0 auto; border-radius: 10px; background: var(--accent); color: var(--accent-fg); font-family: var(--f-display); font-size: 30px; display: flex; align-items: center; justify-content: center; transform: rotate(-6deg); }
.hintpulse { animation: hp 1.1s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
@keyframes hp { 50% { opacity: .35 } }
.drop { animation: drop .16s ease-out; transform-origin: center; transform-box: fill-box; }
@keyframes drop { from { transform: scale(1.18); opacity: .6 } }

@media (max-width: 819px) {
  #play { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; gap: 10px; padding-block: 10px; }
  #side { display: contents; }
  .players { order: -1; flex-direction: row; }
  .pl { flex: 1; padding: 7px 10px; min-width: 0; }
  .pl b { font-size: 16px; }
  .pl small { font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #boardArea { order: 0; }
  #bottom { order: 1; display: flex; flex-direction: column; gap: 8px; }
  #status { font-size: 17px; min-height: 0; }
  #status small { display: inline; margin-left: 6px; }
  .ctrl { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .ctrl button { padding: 9px 4px; font-size: 13.5px; }
  .ruleinfo { display: none; }
}
@media (max-width: 520px) {
  .levels { grid-template-columns: 1fr; }
  .lv { flex-direction: row; align-items: center; flex-wrap: wrap; column-gap: 10px; }
  .lv span { flex: 1 1 160px; min-width: 0; }
  .lv em { flex-basis: 100%; }
  .toggles, .custom { grid-template-columns: minmax(0, 1fr); }
  .brand h1 { font-size: 38px; }
  .brand svg { width: 58px; height: 58px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<main id="setup">
  <div class="col">
    <header class="brand">
      <svg viewBox="0 0 72 72" aria-hidden="true">
        <rect x="2" y="2" width="68" height="68" rx="8" fill="#dcae62"/>
        <g stroke="#4e3416" stroke-width="1.4"><path d="M14 2v68M28 2v68M42 2v68M56 2v68M2 14h68M2 28h68M2 42h68M2 56h68"/></g>
        <circle cx="14" cy="56" r="6" fill="#151515"/><circle cx="28" cy="42" r="6" fill="#151515"/><circle cx="42" cy="28" r="6" fill="#151515"/><circle cx="56" cy="14" r="6" fill="#151515"/>
        <circle cx="28" cy="28" r="6" fill="#f3f1ea" stroke="#9a968c" stroke-width=".8"/><circle cx="42" cy="42" r="6" fill="#f3f1ea" stroke="#9a968c" stroke-width=".8"/>
        <circle cx="56" cy="14" r="2" fill="#b2362b"/>
      </svg>
      <div><h1>한판 오목</h1><p>컴퓨터와 한 판. 다섯 알을 먼저 이으면 이겨요.</p></div>
    </header>

    <section class="group">
      <div class="lab">상대 실력 <small id="recSum"></small></div>
      <div class="levels" id="levels"></div>
    </section>

    <section class="group">
      <div class="lab">내 돌</div>
      <div class="seg" id="segSide"></div>
      <p class="desc">흑이 먼저 둡니다. 렌주룰에서는 흑에게 금수가 있어요.</p>
    </section>

    <section class="group">
      <div class="lab">규칙</div>
      <div class="seg" id="segPreset"></div>
      <p class="desc" id="presetDesc"></p>
      <div class="custom" id="custom" hidden>
        <label>3-3 금지<select id="c-d3"><option value="none">없음</option><option value="black">흑만</option><option value="both">흑·백 모두</option></select></label>
        <label>4-4 금지<select id="c-d4"><option value="none">없음</option><option value="black">흑만</option><option value="both">흑·백 모두</option></select></label>
        <label>흑 장목(6목 이상)<select id="c-overB"><option value="win">이김</option><option value="none">이긴 걸로 안 침</option><option value="forbid">금수</option></select></label>
        <label>백 장목(6목 이상)<select id="c-overW"><option value="win">이김</option><option value="none">이긴 걸로 안 침</option></select></label>
      </div>
      <div class="lab" style="font-size:17px">판 크기</div>
      <div class="seg" id="segSize"></div>
    </section>

    <section class="group">
      <div class="lab">편의</div>
      <div class="seg" id="segUndo"></div>
      <div class="toggles" id="toggles"></div>
    </section>

    <div class="starts">
      <button class="big" id="btnStart">대국 시작</button>
      <button class="big alt" id="btnResume" hidden>이어서 두기</button>
    </div>
    <p class="foot">설정과 전적, 두던 판은 이 브라우저에만 저장돼요.</p>
  </div>
</main>

<main id="play" hidden>
  <div id="boardArea">
    <div id="boardBox">
      <svg id="board" role="img" aria-label="오목판"></svg>
      <div id="toast"></div>
      <div id="result" hidden></div>
    </div>
  </div>
  <aside id="side">
    <div class="players" id="players"></div>
    <div id="bottom">
      <p id="status"></p>
      <div class="ctrl">
        <button id="btnUndo">무르기</button>
        <button id="btnHint">힌트</button>
        <button id="btnResign">기권</button>
        <button id="btnMenu">처음으로</button>
      </div>
    </div>
    <div class="ruleinfo" id="ruleInfo"></div>
  </aside>
</main>

<!--CORE-->

<script>
(function () {
  'use strict';
  const KEY = 'omok-v1';
  const $ = id => document.getElementById(id);
  const coarse = window.matchMedia && matchMedia('(pointer: coarse)').matches;
  const LEVELS = [
    { k: 'low', name: '초급', dots: 1, desc: '막 배우는 단계. 가끔 큰 수를 놓쳐요.' },
    { k: 'mid', name: '중급', dots: 2, desc: '4는 꼭 막고 두 수 앞을 봐요.' },
    { k: 'high', name: '고급', dots: 3, desc: '연속 공격을 찾고 깊이 읽어요. 한 수에 1~2초.' },
  ];
  const PRESET_DESC = {
    renju: '공식 대회 규칙. 흑만 3-3, 4-4, 6목 이상이 금수예요. 백은 6목을 만들어도 이겨요.',
    normal: '흔히 두는 규칙. 흑과 백 모두 3-3이 금지예요. 4-4는 되고, 6목은 이긴 걸로 치지 않아요.',
    free: '금지 없음. 3-3, 4-4 모두 되고 6목 이상도 이겨요. 흑이 아주 유리해요.',
    custom: '금지 규칙과 장목을 직접 정해요.',
  };
  const PRESET_NAME = { renju: '렌주룰', normal: '일반룰', free: '자유룰', custom: '직접 정한 규칙' };
  const DEF = { level: 'mid', side: 'black', preset: 'renju', size: 15, d3: 'black', d4: 'black', overB: 'forbid', overW: 'win',
    undo: '3', showForb: true, showNum: false, coords: false, confirm: coarse, sound: true };

  let data = {};
  try { data = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { data = {}; }
  const set = Object.assign({}, DEF, data.set || {});
  const rec = Object.assign({ low: { w: 0, l: 0, d: 0 }, mid: { w: 0, l: 0, d: 0 }, high: { w: 0, l: 0, d: 0 } }, data.rec || {});
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify({ set, rec, game: G && !G.g.winner ? { moves: G.g.moves, rules: G.g.rules, me: G.me, level: G.level, undoLeft: G.undoLeft } : null })); } catch (e) {}
  }

  /* ── 시작 화면 ── */
  function seg(el, items, key, after) {
    el.innerHTML = '';
    for (const it of items) {
      const b = document.createElement('button');
      b.type = 'button'; b.innerHTML = it.html || it.label;
      b.setAttribute('aria-pressed', String(set[key] === it.v));
      b.onclick = () => { set[key] = it.v; for (const x of el.children) x.setAttribute('aria-pressed', String(x === b)); save(); after && after(); };
      el.appendChild(b);
    }
  }
  function drawLevels() {
    const box = $('levels'); box.innerHTML = '';
    let tw = 0, tl = 0;
    for (const L of LEVELS) {
      const r = rec[L.k]; tw += r.w; tl += r.l;
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'lv';
      b.setAttribute('aria-pressed', String(set.level === L.k));
      b.innerHTML = `<b>${L.name}<span class="dots">${[1, 2, 3].map(i => `<i class="${i <= L.dots ? 'on' : ''}"></i>`).join('')}</span></b><span>${L.desc}</span><em class="num">전적 ${r.w}승 ${r.l}패${r.d ? ' ' + r.d + '무' : ''}</em>`;
      b.onclick = () => { set.level = L.k; save(); drawLevels(); };
      box.appendChild(b);
    }
    $('recSum').textContent = tw + tl ? `모두 ${tw}승 ${tl}패` : '';
  }
  function drawSetup() {
    drawLevels();
    seg($('segSide'), [
      { v: 'black', html: '<span class="stone-ico b"></span>흑 (먼저)' },
      { v: 'white', html: '<span class="stone-ico w"></span>백 (나중)' },
      { v: 'random', label: '무작위' },
    ], 'side');
    const syncPreset = () => {
      $('presetDesc').textContent = PRESET_DESC[set.preset];
      $('custom').hidden = set.preset !== 'custom';
      if (set.preset !== 'custom') { const p = OM.PRESETS[set.preset]; Object.assign(set, p); }
      for (const k of ['d3', 'd4', 'overB', 'overW']) $('c-' + k).value = set[k];
    };
    seg($('segPreset'), ['renju', 'normal', 'free', 'custom'].map(v => ({ v, label: PRESET_NAME[v] })), 'preset', syncPreset);
    syncPreset();
    for (const k of ['d3', 'd4', 'overB', 'overW']) $('c-' + k).onchange = e => { set[k] = e.target.value; save(); };
    seg($('segSize'), [{ v: 15, label: '15줄' }, { v: 19, label: '19줄' }], 'size');
    seg($('segUndo'), [{ v: '0', label: '무르기 없음' }, { v: '3', label: '무르기 3번' }, { v: 'inf', label: '무르기 마음껏' }], 'undo');
    const tg = $('toggles'); tg.innerHTML = '';
    for (const [k, label] of [['showForb', '금수 자리 표시'], ['showNum', '수 번호 보기'], ['coords', '좌표 보기'], ['confirm', '한 번 더 눌러 놓기'], ['sound', '돌 소리']]) {
      const row = document.createElement('div'); row.className = 'tg';
      row.innerHTML = `<span id="tl-${k}">${label}</span>`;
      const b = document.createElement('button'); b.type = 'button'; b.className = 'sw'; b.setAttribute('aria-labelledby', 'tl-' + k);
      b.setAttribute('aria-pressed', String(!!set[k]));
      b.onclick = () => { set[k] = !set[k]; b.setAttribute('aria-pressed', String(set[k])); save(); if (G) render(); };
      row.appendChild(b); tg.appendChild(row);
    }
    $('btnResume').hidden = !(data.game && data.game.moves && data.game.moves.length);
  }

  /* ── 컴퓨터 (가능하면 일꾼 스레드에서) ── */
  let worker = null, reqId = 0;
  const pending = new Map();
  try {
    const src = document.getElementById('core').textContent +
      '\nself.onmessage=function(e){var r=self.OMAI.think(e.data.opt);self.postMessage({id:e.data.id,r:r});};';
    worker = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
    worker.onmessage = e => { const p = pending.get(e.data.id); if (p) { pending.delete(e.data.id); p(e.data.r); } };
    worker.onerror = () => { worker = null; for (const [id, p] of pending) { pending.delete(id); p(null); } };
  } catch (e) { worker = null; }
  function think(opt) {
    return new Promise(res => {
      const id = ++reqId;
      const local = () => setTimeout(() => res(OMAI.think(opt)), 30);
      if (!worker) return local();
      const timer = setTimeout(() => { if (pending.has(id)) { pending.delete(id); worker = null; local(); } }, (opt.time || 1500) + 6000);
      pending.set(id, r => { clearTimeout(timer); r ? res(r) : local(); });
      worker.postMessage({ id, opt });
    });
  }

  /* ── 소리 ── */
  let ac = null;
  function sound(kind) {
    if (!set.sound) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const t = ac.currentTime;
      if (kind === 'stone') {
        const len = 0.06, buf = ac.createBuffer(1, ac.sampleRate * len, ac.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 6);
        const s = ac.createBufferSource(); s.buffer = buf;
        const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1800; f.Q.value = 1.2;
        const g = ac.createGain(); g.gain.value = 0.9;
        s.connect(f).connect(g).connect(ac.destination); s.start(t);
      } else {
        const notes = kind === 'win' ? [523, 659, 784, 1046] : kind === 'lose' ? [392, 330, 262] : [440];
        notes.forEach((fq, k) => {
          const o = ac.createOscillator(), g = ac.createGain();
          o.type = 'triangle'; o.frequency.value = fq;
          g.gain.setValueAtTime(0.0001, t + k * 0.12); g.gain.exponentialRampToValueAtTime(0.18, t + k * 0.12 + 0.02);
          g.gain.exponentialRampToValueAtTime(0.0001, t + k * 0.12 + 0.3);
          o.connect(g).connect(ac.destination); o.start(t + k * 0.12); o.stop(t + k * 0.12 + 0.32);
        });
      }
    } catch (e) {}
  }

  /* ── 대국 ── */
  let G = null; // { g, me, ai, level, undoLeft, seq, thinking, hint, pending, forb, hover, last }
  const LV = Object.fromEntries(LEVELS.map(l => [l.k, l]));

  function startGame(resume) {
    let me, rules, moves = [], level = set.level, undoLeft;
    if (resume && data.game) {
      me = data.game.me; rules = data.game.rules; moves = data.game.moves; level = data.game.level; undoLeft = data.game.undoLeft;
    } else {
      me = set.side === 'black' ? 1 : set.side === 'white' ? 2 : (Math.random() < 0.5 ? 1 : 2);
      rules = { preset: set.preset, size: set.size, d3: set.d3, d4: set.d4, overB: set.overB, overW: set.overW };
      undoLeft = set.undo === 'inf' ? Infinity : +set.undo;
    }
    const g = OM.newGame(rules);
    for (const i of moves) OM.play(g, i);
    G = { g, me, ai: 3 - me, level, undoLeft: undoLeft == null ? Infinity : undoLeft, seq: 0, thinking: false, hint: -1, pending: -1, forb: {}, hover: -1, hints: 0 };
    $('setup').hidden = true; $('play').hidden = false; $('result').hidden = true;
    buildBoard(); layout(); save(); next();
  }
  function next() {
    const g = G.g;
    G.hint = -1; G.pending = -1;
    if (g.winner) return finish();
    if (g.turn === G.ai) aiMove();
    else { G.forb = set.showForb ? OM.forbiddenList(g) : {}; render(); }
  }
  async function aiMove() {
    G.thinking = true; G.forb = {}; render();
    const seq = ++G.seq, t0 = Date.now();
    const g = G.g;
    const r = await think({ board: g.board.slice(), n: g.n, rules: g.rules, color: G.ai, level: G.level, time: G.level === 'high' ? 1500 : 400 });
    const wait = Math.max(0, 380 - (Date.now() - t0));
    if (wait) await new Promise(res => setTimeout(res, wait));
    if (!G || seq !== G.seq) return;
    G.thinking = false;
    let mv = r && r.move;
    if (!(mv >= 0) || g.board[mv] || OM.forbiddenAt(g, mv)) { mv = -1; for (let i = 0; i < g.board.length; i++) if (!g.board[i] && !OM.forbiddenAt(g, i)) { mv = i; break; } }
    if (mv < 0) { g.winner = 3; return finish(); }
    OM.play(g, mv); G.last = mv; sound('stone'); save(); next();
  }
  function human(i) {
    const g = G.g;
    if (G.thinking || g.winner || g.turn !== G.me || g.board[i]) return;
    const f = OM.forbiddenAt(g, i);
    if (f) { toast(f + ' 금수 자리예요'); G.pending = -1; render(); return; }
    if (set.confirm && G.pending !== i) { G.pending = i; render(); return; }
    OM.play(g, i); G.last = i; sound('stone'); save(); next();
  }
  function finish() {
    const g = G.g; G.thinking = false; render();
    const w = g.winner, mine = w === G.me, draw = w === 3;
    const r = rec[G.level]; if (!G.counted) { G.counted = true; if (draw) r.d++; else if (mine) r.w++; else r.l++; }
    save();
    sound(draw ? 'draw' : mine ? 'win' : 'lose');
    const box = $('result');
    const title = draw ? '비겼어요' : mine ? '이겼어요!' : '졌어요';
    const why = G.resigned ? '기권했어요.' : draw ? '더 둘 자리가 없어요.' : `${w === 1 ? '흑' : '백'}이 ${g.moves.length}수 만에 다섯을 이었어요.`;
    box.innerHTML = `<div class="card"><div class="seal">${draw ? '和' : mine ? '勝' : '敗'}</div><h2>${title}</h2>
      <p>${why} ${LV[G.level].name} 전적 ${r.w}승 ${r.l}패${r.d ? ' ' + r.d + '무' : ''}</p>
      <div class="row"><button class="main" id="rAgain">한 판 더</button><button id="rSwap">색 바꿔 한 판</button></div>
      <div class="row"><button id="rLook">판 다시 보기</button><button id="rMenu">처음으로</button></div></div>`;
    box.hidden = false;
    $('rAgain').onclick = () => { set.side = G.me === 1 ? 'black' : 'white'; startGame(false); };
    $('rSwap').onclick = () => { set.side = G.me === 1 ? 'white' : 'black'; save(); startGame(false); };
    $('rLook').onclick = () => { box.hidden = true; };
    $('rMenu').onclick = toMenu;
  }
  function toMenu() {
    if (G) { G.seq++; save(); }
    G = null;
    try { data = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { data = {}; }
    $('play').hidden = true; $('setup').hidden = false; drawSetup();
  }

  let toastT = 0;
  function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 1600); }

  /* 버튼 */
  $('btnStart').onclick = () => startGame(false);
  $('btnResume').onclick = () => startGame(true);
  $('btnMenu').onclick = toMenu;
  $('btnUndo').onclick = () => {
    if (!G || G.undoLeft <= 0) return;
    const g = G.g;
    if (!g.moves.length) return;
    G.seq++; G.thinking = false;
    // 내 마지막 수까지 되돌림
    OM.undo(g);
    while (g.moves.length && g.turn !== G.me) OM.undo(g);
    G.undoLeft--; G.resigned = false; G.last = g.moves[g.moves.length - 1];
    $('result').hidden = true; save(); next();
  };
  $('btnHint').onclick = async () => {
    if (!G || G.thinking || G.g.winner || G.g.turn !== G.me) return;
    const seq = ++G.seq; G.thinking = 'hint'; render();
    const g = G.g;
    const r = await think({ board: g.board.slice(), n: g.n, rules: g.rules, color: G.me, level: 'high', time: 900 });
    if (!G || seq !== G.seq) return;
    G.thinking = false; G.hint = r && r.move >= 0 ? r.move : -1; G.hints++;
    if (G.hint >= 0) toast('여기는 어때요? (' + r.why + ')');
    render();
  };
  let resignArm = 0;
  $('btnResign').onclick = () => {
    if (!G || G.g.winner) return;
    const b = $('btnResign');
    if (Date.now() - resignArm > 2500) { resignArm = Date.now(); b.textContent = '정말 기권?'; b.classList.add('warn'); setTimeout(() => { b.textContent = '기권'; b.classList.remove('warn'); }, 2500); return; }
    G.seq++; G.resigned = true; G.g.winner = G.ai; b.textContent = '기권'; b.classList.remove('warn'); finish();
  };

  /* ── 판 그리기 ── */
  const NS = 'http://www.w3.org/2000/svg';
  const CELL = 40;
  let geo = null;
  function el(tag, attrs, parent) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
  const COLS = 'ABCDEFGHJKLMNOPQRST';
  function buildBoard() {
    const n = G.g.n, m = set.coords ? 54 : 34, W = m * 2 + (n - 1) * CELL;
    geo = { n, m, W };
    const svg = $('board');
    svg.setAttribute('viewBox', `0 0 ${W} ${W}`);
    svg.innerHTML = `<defs>
      <radialGradient id="gb" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#6a6a6a"/><stop offset=".45" stop-color="#1e1e1e"/><stop offset="1" stop-color="#080808"/></radialGradient>
      <radialGradient id="gw" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#ecebe4"/><stop offset="1" stop-color="#c4c2b8"/></radialGradient>
      <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--wood-hi)"/><stop offset="1" stop-color="var(--wood)"/></linearGradient>
      <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="1.2" dy="2" stdDeviation="1.4" flood-color="#2a1a05" flood-opacity=".45"/></filter>
    </defs>`;
    el('rect', { x: 0, y: 0, width: W, height: W, fill: 'url(#wood)', rx: 6 }, svg);
    // 나뭇결
    const grain = el('g', { opacity: .16, stroke: 'var(--wood-ink)', fill: 'none' }, svg);
    let s = 7;
    const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
    for (let k = 0; k < 26; k++) {
      const y = rnd() * W, a = 6 + rnd() * 14;
      el('path', { d: `M0 ${y} C ${W * .3} ${y - a}, ${W * .6} ${y + a}, ${W} ${y - a * .4}`, 'stroke-width': .6 + rnd() * 1.2 }, grain);
    }
    const lines = el('g', { stroke: 'var(--wood-ink)', 'stroke-width': 1.3, 'stroke-linecap': 'square' }, svg);
    const end = m + (n - 1) * CELL;
    for (let k = 0; k < n; k++) {
      const p = m + k * CELL;
      el('line', { x1: m, y1: p, x2: end, y2: p, 'stroke-width': k === 0 || k === n - 1 ? 2.2 : 1.3 }, lines);
      el('line', { x1: p, y1: m, x2: p, y2: end, 'stroke-width': k === 0 || k === n - 1 ? 2.2 : 1.3 }, lines);
    }
    const stars = n === 15 ? [3, 7, 11] : [3, 9, 15];
    for (const a of stars) for (const b of stars) el('circle', { cx: m + a * CELL, cy: m + b * CELL, r: 4.5, fill: 'var(--wood-ink)' }, svg);
    if (set.coords) {
      const cg = el('g', { fill: 'var(--wood-ink)', 'font-size': 15, 'font-family': 'Gothic A1, sans-serif', 'text-anchor': 'middle', 'font-weight': 600 }, svg);
      for (let k = 0; k < n; k++) {
        const p = m + k * CELL;
        el('text', { x: p, y: m - 24 }, cg).textContent = COLS[k];
        el('text', { x: m - 28, y: p + 5 }, cg).textContent = n - k;
      }
    }
    geo.layer = el('g', {}, svg);
    geo.coordsOn = set.coords;
  }
  function pt(i) { return [geo.m + (i % geo.n) * CELL, geo.m + ((i / geo.n) | 0) * CELL]; }
  function stone(i, c, extra, parent) {
    const [x, y] = pt(i);
    return el('circle', Object.assign({ cx: x, cy: y, r: CELL * 0.46, fill: c === 1 ? 'url(#gb)' : 'url(#gw)', filter: 'url(#sh)' }, extra || {}), parent);
  }
  function render() {
    if (!G) return;
    if (geo.coordsOn !== set.coords || geo.n !== G.g.n) { buildBoard(); layout(); }
    if (!set.showForb) G.forb = {}; else if (!G.thinking && !G.g.winner && G.g.turn === G.me && !Object.keys(G.forb).length && OM.restricted(G.g.rules, G.me)) G.forb = OM.forbiddenList(G.g);
    const L = geo.layer, g = G.g;
    L.innerHTML = '';
    g.moves.forEach((i, k) => {
      const c = g.board[i];
      const s = stone(i, c, {}, L);
      if (i === G.last && k === g.moves.length - 1) s.classList.add('drop');
      if (set.showNum) {
        const [x, y] = pt(i);
        const t = el('text', { x, y: y + 5, 'text-anchor': 'middle', 'font-size': k + 1 >= 100 ? 13 : 15, 'font-weight': 700, 'font-family': 'Gothic A1, sans-serif', fill: c === 1 ? '#f2f0e8' : '#1a1a1a' }, L);
        t.textContent = k + 1;
      }
    });
    const lastI = g.moves[g.moves.length - 1];
    if (lastI != null && !set.showNum) { const [x, y] = pt(lastI); el('circle', { cx: x, cy: y, r: 5.5, fill: 'var(--accent)' }, L); }
    if (lastI != null && set.showNum) { const [x, y] = pt(lastI); el('circle', { cx: x, cy: y, r: CELL * 0.46, fill: 'none', stroke: 'var(--accent)', 'stroke-width': 3 }, L); }
    for (const k in G.forb) {
      const [x, y] = pt(+k), d = 7;
      const f = el('g', { stroke: 'var(--accent)', 'stroke-width': 3, 'stroke-linecap': 'round', opacity: .85 }, L);
      el('path', { d: `M${x - d} ${y - d}L${x + d} ${y + d}M${x + d} ${y - d}L${x - d} ${y + d}` }, f);
      el('title', {}, f).textContent = G.forb[k] + ' 금수';
    }
    if (g.line) {
      const [x1, y1] = pt(g.line[0]), [x2, y2] = pt(g.line[g.line.length - 1]);
      el('line', { x1, y1, x2, y2, stroke: 'var(--accent)', 'stroke-width': 7, 'stroke-linecap': 'round', opacity: .8 }, L);
    }
    if (G.hint >= 0 && !g.board[G.hint]) {
      const [x, y] = pt(G.hint);
      el('circle', { cx: x, cy: y, r: CELL * 0.44, fill: 'none', stroke: 'var(--ok)', 'stroke-width': 3.5, 'stroke-dasharray': '6 5', class: 'hintpulse' }, L);
    }
    const ghost = G.pending >= 0 ? G.pending : G.hover;
    if (ghost >= 0 && !g.board[ghost] && !G.thinking && !g.winner && g.turn === G.me && !G.forb[ghost]) {
      stone(ghost, G.me, { opacity: G.pending === ghost ? .75 : .45, filter: '' }, L);
      if (G.pending === ghost) { const [x, y] = pt(ghost); el('circle', { cx: x, cy: y, r: CELL * 0.5, fill: 'none', stroke: 'var(--accent)', 'stroke-width': 2.5 }, L); }
    }
    // 옆 패널
    const name = c => (c === G.me ? '나' : '컴퓨터 ' + LV[G.level].name);
    const sub = c => (c === 1 ? '흑 · 먼저' : '백 · 나중') + (c === G.me && G.undoLeft !== Infinity ? ` · 무르기 ${G.undoLeft}번` : '');
    $('players').innerHTML = [1, 2].map(c => `<div class="pl ${!g.winner && g.turn === c ? 'turn' : ''} ${G.thinking === true && c === G.ai ? 'thinking' : ''}">
      <span class="stone-ico ${c === 1 ? 'b' : 'w'}"></span><div><b>${name(c)}</b><small>${sub(c)}</small></div>
      <span class="think"><i></i><i></i><i></i></span></div>`).join('');
    let st;
    if (g.winner) st = g.winner === 3 ? '비겼어요' : g.winner === G.me ? '이겼어요!' : '컴퓨터가 이겼어요';
    else if (G.thinking === 'hint') st = '좋은 수를 찾는 중…';
    else if (G.thinking) st = '컴퓨터가 생각하는 중…';
    else st = G.pending >= 0 ? '한 번 더 누르면 놓여요' : '내 차례예요';
    const nf = Object.keys(G.forb).length;
    $('status').innerHTML = `${st}<small class="num">${g.moves.length}수째${nf && !g.winner ? ` · 금수 ${nf}곳 표시` : ''}</small>`;
    $('btnUndo').disabled = G.undoLeft <= 0 || !g.moves.some(i => g.board[i] === G.me);
    $('btnUndo').textContent = G.undoLeft === Infinity || G.undoLeft <= 0 ? '무르기' : `무르기 ${G.undoLeft}`;
    $('btnHint').disabled = !!G.thinking || !!g.winner || g.turn !== G.me;
    $('btnResign').disabled = !!g.winner;
    const R = g.rules;
    const who = v => ({ none: '없음', black: '흑만', both: '흑·백' }[v]);
    const ov = v => ({ win: '이김', none: '무효', forbid: '금수' }[v]);
    $('ruleInfo').innerHTML = `<b>${PRESET_NAME[R.preset]} · ${R.size}줄</b><br>3-3 금지 ${who(R.d3)} · 4-4 금지 ${who(R.d4)}<br>6목 이상: 흑 ${ov(R.overB)}, 백 ${ov(R.overW)}`;
  }
  function layout() {
    if (!geo || $('play').hidden) return;
    const area = $('boardArea'), box = $('boardBox');
    const w = area.clientWidth, h = area.clientHeight;
    const s = Math.max(200, Math.floor(Math.min(w, h)));
    box.style.width = s + 'px'; box.style.height = s + 'px';
  }
  window.addEventListener('resize', layout);
  function hit(e) {
    const svg = $('board'), r = svg.getBoundingClientRect();
    const k = geo.W / r.width;
    const x = (e.clientX - r.left) * k, y = (e.clientY - r.top) * k;
    const cx = Math.round((x - geo.m) / CELL), cy = Math.round((y - geo.m) / CELL);
    if (cx < 0 || cy < 0 || cx >= geo.n || cy >= geo.n) return -1;
    const dx = x - (geo.m + cx * CELL), dy = y - (geo.m + cy * CELL);
    if (dx * dx + dy * dy > (CELL * 0.55) ** 2) return -1;
    return cy * geo.n + cx;
  }
  $('board').addEventListener('click', e => { if (!G) return; const i = hit(e); if (i >= 0) human(i); });
  $('board').addEventListener('pointermove', e => { if (!G || e.pointerType !== 'mouse') return; const i = hit(e); if (i !== G.hover) { G.hover = i; render(); } });
  $('board').addEventListener('pointerleave', () => { if (G && G.hover >= 0) { G.hover = -1; render(); } });

  drawSetup();
  if (data.game && data.game.moves && data.game.moves.length && location.hash === '#play') startGame(true);
})();
</script>
