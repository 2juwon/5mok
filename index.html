<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="컴퓨터(초급·중급·고급)와 두거나, 한 기기로 둘이서, 각자 휴대폰으로 온라인 1대1. 렌주룰·일반룰·자유룰과 금수 표시.">
<meta property="og:title" content="한판 오목">
<meta property="og:description" content="컴퓨터와 한 판. 다섯 알을 먼저 이으면 이겨요.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif}[hidden]{display:none!important}</style>
<title>한판 오목</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gothic+A1:wght@400;600;800&display=swap">
<style>
/* 레이아웃: 한 화면 앱. 시작 화면(설정 한 줄 기둥) ↔ 대국 화면(넓으면 판 | 옆 패널, 좁으면 위 띠 / 판 / 아래 버튼) */
:root {
  --bg: #e3e7df; --panel: #f4f6f1; --fg: #1c211e; --muted: #5d6960; --line: #cad1c6;
  --wood: #dcae62; --wood-hi: #e8c27e; --wood-ink: #4e3416; --accent: #b2362b; --accent-fg: #fff;
  --ok: #2f6b45; --chip: #e9ede5;
  --f-display: "Do Hyeon", "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-body: "Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --r: 12px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #131714; --panel: #1c211d; --fg: #e4e9e1; --muted: #93a096; --line: #2e372f;
  --wood: #c79855; --wood-hi: #d6a865; --wood-ink: #3a260e; --accent: #e2675a; --accent-fg: #1a0d0b;
  --ok: #7cc495; --chip: #252c26; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #131714; --panel: #1c211d; --fg: #e4e9e1; --muted: #93a096; --line: #2e372f;
  --wood: #c79855; --wood-hi: #d6a865; --wood-ink: #3a260e; --accent: #e2675a; --accent-fg: #1a0d0b;
  --ok: #7cc495; --chip: #252c26; color-scheme: dark }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.5;
  -webkit-tap-highlight-color: transparent; }
button, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

/* ── 시작 화면 ── */
#setup { min-height: 100%; padding-block: 28px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.col { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.brand { display: flex; align-items: center; gap: 16px; }
.brand svg { flex: none; width: 72px; height: 72px; }
.brand h1 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 44px; line-height: 1; letter-spacing: -0.5px; }
.brand p { margin: 6px 0 0; color: var(--muted); }
section.group { display: flex; flex-direction: column; gap: 10px; }
.lab { font-family: var(--f-display); font-size: 20px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.lab small { font-family: var(--f-body); font-size: 13px; color: var(--muted); }
.levels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.lv { text-align: left; background: var(--panel); border: 1.5px solid var(--line); border-radius: var(--r); padding: 12px 12px 10px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.lv b { font-family: var(--f-display); font-weight: 400; font-size: 24px; display: flex; align-items: center; gap: 8px; flex: none; white-space: nowrap; }
.lv .dots { display: inline-flex; gap: 3px; }
.lv .dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.lv .dots i.on { background: var(--fg); }
.lv span { font-size: 13px; color: var(--muted); line-height: 1.35; }
.lv em { font-style: normal; font-size: 12px; color: var(--muted); margin-top: 2px; }
.lv[aria-pressed="true"] { border-color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg); }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { background: var(--panel); border: 1.5px solid var(--line); border-radius: 999px; padding: 7px 14px; display: inline-flex; align-items: center; gap: 7px; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.stone-ico { width: 14px; height: 14px; border-radius: 50%; display: inline-block; flex: none; }
.stone-ico.b { background: radial-gradient(circle at 35% 30%, #666, #111 60%); }
.stone-ico.w { background: radial-gradient(circle at 35% 30%, #fff, #cfcfc6 75%); box-shadow: inset 0 0 0 1px rgba(0,0,0,.25); }
.desc { margin: 0; font-size: 13.5px; color: var(--muted); }
.custom { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; background: var(--panel); border: 1.5px solid var(--line); border-radius: var(--r); padding: 12px; }
.custom label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
.custom select { padding: 7px 8px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--bg); color: var(--fg); }
.toggles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 14px; }
.tg { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.tg span { font-size: 14px; }
.sw { width: 42px; height: 24px; border-radius: 12px; border: none; background: var(--line); position: relative; flex: none; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--panel); transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
.sw[aria-pressed="true"] { background: var(--ok); }
.sw[aria-pressed="true"]::after { transform: translateX(18px); }
.starts { display: flex; gap: 10px; flex-wrap: wrap; }
.big { font-family: var(--f-display); font-size: 22px; border: none; border-radius: var(--r); padding: 12px 26px; background: var(--fg); color: var(--bg); }
.big.alt { background: transparent; color: var(--fg); box-shadow: inset 0 0 0 1.5px var(--fg); }
.foot { font-size: 12.5px; color: var(--muted); margin: 0; }

/* ── 대국 화면 ── */
#play { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 18px; padding-block: 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); box-sizing: border-box; }
#boardArea { min-width: 0; min-height: 0; display: flex; align-items: center; justify-content: center; position: relative; }
#boardBox { position: relative; }
#board { display: block; width: 100%; height: 100%; touch-action: manipulation; user-select: none; -webkit-user-select: none; border-radius: 6px;
  box-shadow: 0 1px 0 rgba(255,255,255,.25) inset, 0 10px 30px rgba(30,20,5,.28), 0 2px 4px rgba(30,20,5,.25); }
#side { display: flex; flex-direction: column; gap: 14px; min-width: 0; min-height: 0; }
.players { display: flex; flex-direction: column; gap: 8px; }
.pl { display: flex; align-items: center; gap: 10px; background: var(--panel); border: 1.5px solid var(--line); border-radius: var(--r); padding: 10px 12px; }
.pl .stone-ico { width: 22px; height: 22px; }
.pl div { display: flex; flex-direction: column; min-width: 0; }
.pl b { font-family: var(--f-display); font-weight: 400; font-size: 19px; line-height: 1.15; }
.pl small { color: var(--muted); font-size: 12.5px; }
.pl.turn { border-color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg); }
.pl .think { margin-left: auto; display: none; gap: 3px; }
.pl.thinking .think { display: inline-flex; }
.think i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: bob 1s infinite ease-in-out; }
.think i:nth-child(2) { animation-delay: .15s } .think i:nth-child(3) { animation-delay: .3s }
@keyframes bob { 0%,100% { transform: translateY(0); opacity: .4 } 50% { transform: translateY(-4px); opacity: 1 } }
#status { font-family: var(--f-display); font-size: 21px; line-height: 1.25; min-height: 2.5em; margin: 0; }
#status small { display: block; font-family: var(--f-body); font-size: 13px; color: var(--muted); }
.ctrl { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.ctrl button { background: var(--panel); border: 1.5px solid var(--line); border-radius: var(--r); padding: 10px 8px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px; }
.ctrl button:disabled { opacity: .45; cursor: default; }
.ctrl button.warn { border-color: var(--accent); color: var(--accent); }
.ruleinfo { font-size: 13px; color: var(--muted); background: var(--chip); border-radius: var(--r); padding: 10px 12px; }
.ruleinfo b { color: var(--fg); font-weight: 600; }
#toast { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 7px 14px; border-radius: 999px; font-size: 14px; font-weight: 600; pointer-events: none; opacity: 0; transition: opacity .2s; white-space: nowrap; z-index: 3; }
#toast.on { opacity: 1; }
#result { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 4; }
#result .card { background: var(--panel); border-radius: 16px; padding: 22px 22px 18px; width: min(320px, 88%); text-align: center; box-shadow: 0 16px 40px rgba(0,0,0,.3); display: flex; flex-direction: column; gap: 12px; animation: pop .35s cubic-bezier(.2,1.4,.4,1); }
@keyframes pop { from { transform: scale(.88) } }
#result h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 40px; line-height: 1; }
#result p { margin: 0; color: var(--muted); font-size: 14px; }
#result .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
#result button { border: none; border-radius: 10px; padding: 9px 14px; font-weight: 600; background: var(--chip); }
#result button.main { background: var(--fg); color: var(--bg); }
.seal { width: 64px; height: 64px; margin: 0 auto; border-radius: 10px; background: var(--accent); color: var(--accent-fg); font-family: var(--f-display); font-size: 30px; display: flex; align-items: center; justify-content: center; transform: rotate(-6deg); }
.hintpulse { animation: hp 1.1s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
@keyframes hp { 50% { opacity: .35 } }
.drop { animation: drop .16s ease-out; transform-origin: center; transform-box: fill-box; }
@keyframes drop { from { transform: scale(1.18); opacity: .6 } }

@media (max-width: 819px) {
  #play { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; gap: 10px; padding-block: 10px; }
  #side { display: contents; }
  .players { order: -1; flex-direction: row; }
  .pl { flex: 1; padding: 7px 10px; min-width: 0; }
  .pl b { font-size: 16px; }
  .pl small { font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #boardArea { order: 0; }
  #bottom { order: 1; display: flex; flex-direction: column; gap: 8px; }
  #status { font-size: 17px; min-height: 0; }
  #status small { display: inline; margin-left: 6px; }
  .ctrl { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .ctrl button { padding: 9px 4px; font-size: 13.5px; }
  .ruleinfo { display: none; }
}
@media (max-width: 520px) {
  .levels { grid-template-columns: 1fr; }
  .lv { flex-direction: row; align-items: center; flex-wrap: wrap; column-gap: 10px; }
  .lv span { flex: 1 1 160px; min-width: 0; }
  .lv em { flex-basis: 100%; }
  .toggles, .custom { grid-template-columns: minmax(0, 1fr); }
  .brand h1 { font-size: 38px; }
  .brand svg { width: 58px; height: 58px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ── 모드 탭·온라인 ── */
.modes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; background: var(--chip); border-radius: 14px; padding: 4px; }
.modes button { border: none; background: transparent; border-radius: 10px; padding: 10px 6px; font-family: var(--f-display); font-size: 19px; display: flex; flex-direction: column; align-items: center; gap: 0; line-height: 1.2; }
.modes button small { font-family: var(--f-body); font-size: 11.5px; color: var(--muted); }
.modes button[aria-pressed="true"] { background: var(--panel); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); min-width: 0; }
.field input { font: inherit; font-size: 16px; color: var(--fg); background: var(--panel); border: 1.5px solid var(--line); border-radius: 10px; padding: 9px 12px; min-width: 0; }
.field input:focus { border-color: var(--fg); outline: none; }
.names { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.names .field span { display: flex; align-items: center; gap: 6px; }
.join { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; }
.join .field { flex: 1 1 160px; }
.join input.code { letter-spacing: 4px; font-variant-numeric: tabular-nums; }
.btn { border: 1.5px solid var(--fg); background: transparent; color: var(--fg); border-radius: 10px; padding: 9px 16px; font-weight: 700; }
.btn.fill { background: var(--fg); color: var(--bg); }
.btn:disabled { opacity: .4; cursor: default; }
.online-acts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.online-acts .big { padding: 14px 10px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.online-acts .big small { font-family: var(--f-body); font-size: 12.5px; opacity: .75; }
.msg { margin: 0; padding: 10px 12px; border-radius: 10px; background: var(--chip); font-size: 14px; }
.msg.err { color: var(--accent); }
.msg a { color: inherit; font-weight: 700; }
#room { min-height: 100%; padding-block: 24px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.roomtop { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.roomtop h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 28px; }
.codecard { background: var(--wood); color: var(--wood-ink); border-radius: 14px; padding: 16px 18px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.codecard .lbl { font-size: 13px; font-weight: 600; opacity: .8; }
.codecard .code { font-family: var(--f-display); font-size: 44px; letter-spacing: 6px; line-height: 1; font-variant-numeric: tabular-nums; }
.codecard .link { font-size: 12.5px; user-select: all; word-break: break-all; opacity: .85; }
.codecard .btn { border-color: var(--wood-ink); color: var(--wood-ink); }
.seats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.seat { background: var(--panel); border: 1.5px solid var(--line); border-radius: var(--r); padding: 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.seat b { font-family: var(--f-display); font-weight: 400; font-size: 21px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seat small { color: var(--muted); font-size: 12.5px; }
.seat.empty { border-style: dashed; background: transparent; }
.seat.empty b { color: var(--muted); }
.badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px; background: var(--fg); color: var(--bg); margin-left: 6px; vertical-align: 3px; font-family: var(--f-body); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); margin-right: 5px; vertical-align: 1px; }
.dot.off { background: var(--accent); }
.summary { font-size: 14px; background: var(--chip); border-radius: var(--r); padding: 10px 12px; }
.pl { position: relative; overflow: hidden; }
.pl .bar { position: absolute; left: 0; bottom: 0; height: 4px; background: var(--ok); width: 0; transition: width .25s linear; }
.pl .bar.low { background: var(--accent); }
.pl .bubble { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: var(--fg); color: var(--bg); font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; white-space: nowrap; max-width: 70%; overflow: hidden; text-overflow: ellipsis; animation: pop .25s; }
#ask { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 5; background: var(--panel); border-radius: 14px; padding: 12px 14px; box-shadow: 0 10px 30px rgba(0,0,0,.3); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; width: max-content; max-width: 92%; }
#ask b { font-weight: 700; }
#says { position: absolute; z-index: 6; background: var(--panel); border-radius: 14px; padding: 8px; box-shadow: 0 10px 30px rgba(0,0,0,.3); display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; width: min(320px, 92%); left: 50%; bottom: 14px; transform: translateX(-50%); }
#says button { border: none; background: var(--chip); border-radius: 10px; padding: 9px 8px; font-weight: 600; font-size: 14px; }
#net { position: fixed; left: 50%; top: calc(10px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); background: var(--accent); color: var(--accent-fg); padding: 6px 14px; border-radius: 999px; font-size: 13px; font-weight: 700; z-index: 20; }
@media (max-width: 520px) {
  .names, .online-acts { grid-template-columns: minmax(0, 1fr); }
  .modes button { font-size: 17px; }
  .codecard .code { font-size: 36px; }
}
</style>
</head>
<body>



<main id="setup">
  <div class="col">
    <header class="brand">
      <svg viewBox="0 0 72 72" aria-hidden="true">
        <rect x="2" y="2" width="68" height="68" rx="8" fill="#dcae62"/>
        <g stroke="#4e3416" stroke-width="1.4"><path d="M14 2v68M28 2v68M42 2v68M56 2v68M2 14h68M2 28h68M2 42h68M2 56h68"/></g>
        <circle cx="14" cy="56" r="6" fill="#151515"/><circle cx="28" cy="42" r="6" fill="#151515"/><circle cx="42" cy="28" r="6" fill="#151515"/><circle cx="56" cy="14" r="6" fill="#151515"/>
        <circle cx="28" cy="28" r="6" fill="#f3f1ea" stroke="#9a968c" stroke-width=".8"/><circle cx="42" cy="42" r="6" fill="#f3f1ea" stroke="#9a968c" stroke-width=".8"/>
        <circle cx="56" cy="14" r="2" fill="#b2362b"/>
      </svg>
      <div><h1>한판 오목</h1><p>다섯 알을 먼저 이으면 이겨요.</p></div>
    </header>

    <div class="modes" id="modes" role="group" aria-label="대국 방식"></div>

    <section class="group" id="pAi">
      <div class="lab">상대 실력 <small id="recSum"></small></div>
      <div class="levels" id="levels"></div>
      <div class="lab">내 돌</div>
      <div class="seg" id="segSide"></div>
      <p class="desc">흑이 먼저 둡니다. 렌주룰에서는 흑에게 금수가 있어요.</p>
    </section>

    <section class="group" id="pLocal" hidden>
      <div class="lab">두 사람 <small>한 기기로 번갈아 둬요</small></div>
      <div class="names">
        <label class="field"><span><span class="stone-ico b"></span>흑 (먼저)</span><input id="nameB" maxlength="8" placeholder="흑" autocomplete="off"></label>
        <label class="field"><span><span class="stone-ico w"></span>백 (나중)</span><input id="nameW" maxlength="8" placeholder="백" autocomplete="off"></label>
      </div>
    </section>

    <section class="group" id="pOnline" hidden>
      <div class="lab">온라인 대결 <small id="onStats"></small></div>
      <div id="onBody">
        <div class="col" style="gap:14px">
          <label class="field">내 이름<input id="myName" maxlength="8" placeholder="상대에게 보일 이름" autocomplete="nickname"></label>
          <div class="online-acts">
            <button class="big" id="btnQuick">빠른 참가<small>기다리는 사람과 바로</small></button>
            <button class="big alt" id="btnCreate">방 만들기<small>친구를 링크로 초대</small></button>
          </div>
          <div class="join">
            <label class="field">방 번호<input id="joinCode" class="code" inputmode="numeric" maxlength="6" placeholder="6자리" autocomplete="off"></label>
            <button class="btn fill" id="btnJoin">들어가기</button>
          </div>
          <p class="msg" id="onMsg" hidden></p>
        </div>
      </div>
    </section>

    <section class="group" id="pRules">
      <div class="lab">규칙</div>
      <div id="setupRules"></div>
    </section>

    <section class="group">
      <div class="lab">편의</div>
      <div class="seg" id="segUndo"></div>
      <div class="toggles" id="toggles"></div>
    </section>

    <div class="starts" id="starts">

<script id="core">

 *   7 다섯, 6 열린 4(또는 한 줄 쌍4), 5 막힌 4, 4 열린 3, 3 막힌 3, 2 열린 2, 1 막힌 2

      for (const m of list) if (!m.D.forb && m.D.s >= 1e6) { threat = true; break; }
      const width = ply <= 1 ? S.width : Math.max(5, S.width - 2);
      if (threat) {
        for (const m of list) {
          if (m.A.forb) continue;
          if (m.D.s >= 1000 || m.A.n5) moves.push(m);
          if (moves.length >= width + 2) break;
        }
      }
      if (!moves.length) {
        let extra = 0;
        for (const m of list) {
          if (m.A.forb) continue;
          if (moves.length < width) moves.push(m);
          else if (m.A.n5 && extra < 3) { moves.push(m); extra++; }
        }
      }
      if (!moves.length) return 0;
    }
    let best = -Infinity;
    for (const m of moves) {
      ctx.place(m.i, c);
      const v = -nega(ctx, 3 - c, depth - 1, -beta, -alpha, ply + 1, S);
      ctx.unplace(m.i, c);
      if (S.abort) return 0;
      if (v > best) best = v;
      if (v > alpha) alpha = v;
      if (alpha >= beta) break;
    }
    return best;
  }

  function rootSearch(ctx, c, cands, maxDepth, width, deadline) {
    let order = cands.slice(), bestMove = order[0].i, bestVal = 0, reached = 0;
    for (let d = 2; d <= maxDepth; d += 2) {
      const S = { deadline, abort: false, width, nodes: 0 };
      let alpha = -Infinity, curBest = -1, curVal = -Infinity;
      const vals = new Map();
      for (const m of order) {
        ctx.place(m.i, c);
        const v = -nega(ctx, 3 - c, d - 1, -Infinity, -alpha, 1, S);
        ctx.unplace(m.i, c);
        if (S.abort) break;
        vals.set(m.i, v);
        if (v > curVal) { curVal = v; curBest = m.i; }
        if (v > alpha) alpha = v;
      }
      if (S.abort && curBest < 0) break;
      if (S.abort) { if (curVal > bestVal || curBest === bestMove) { bestMove = curBest; bestVal = curVal; } break; }
      bestMove = curBest; bestVal = curVal; reached = d;
      if (curVal >= WIN - 100 || curVal <= -WIN + 100) break;
      order = order.slice().sort((p, q) => (vals.get(q.i) ?? -Infinity) - (vals.get(p.i) ?? -Infinity));
    }
    return { move: bestMove, val: bestVal, depth: reached };
  }

  // 연속 4로 이기는 길 찾기 (c가 둘 차례)
  function blockPts(ctx, i, c) {
    const n = ctx.n, x = i % n, y = (i / n) | 0, ex = OM.exact(ctx.rules, c), out = [];
    for (const [dx, dy] of DIRS) {
      for (const o of OM.fivePoints(ctx.b, n, x, y, dx, dy, c, ex)) {
        const q = (y + o * dy) * n + x + o * dx;
        if (!out.includes(q)) out.push(q);
      }
    }
    return out;
  }
  function vcf(ctx, c, S, depth) {
    depth = depth || 0;
    if (++S.nodes > S.max || depth > S.maxDepth || Date.now() > S.deadline) return null;
    const key = ctx.key();
    if (S.fail.has(key)) return null;
    const b = ctx.b, near = ctx.near, o = 3 - c, N = b.length, fours = [];
    for (let i = 0; i < N; i++) {
      if (b[i] || !near[i]) continue;
      const A = evalPt(ctx, i, c);
      if (A.five) return [i];
      if (!A.forb && (A.n6 || A.n5)) fours.push({ i, s: A.s });
    }
    for (let i = 0; i < N; i++) if (!b[i] && near[i] && isFivePt(ctx, i, o)) { S.fail.add(key); return null; }
    fours.sort((p, q) => q.s - p.s);
    for (const f of fours) {
      ctx.place(f.i, c);
      const blocks = blockPts(ctx, f.i, c);
      let r = null;
      if (blocks.length >= 2) r = [f.i];
      else if (blocks.length === 1) {
        const q = blocks[0];
        if (ctx.res[o] && OM.forbiddenRaw(ctx.b, ctx.n, q % ctx.n, (q / ctx.n) | 0, o, ctx.rules, 0)) r = [f.i];
        else {
          ctx.place(q, o);
          const sub = vcf(ctx, c, S, depth + 1);
          ctx.unplace(q, o);
          if (sub) r = [f.i, q].concat(sub);
        }
      }
      ctx.unplace(f.i, c);
      if (r) return r;
    }
    S.fail.add(key);
    return null;
  }
  function findVCF(ctx, c, maxNodes, deadline) {
    return vcf(ctx, c, { nodes: 0, max: maxNodes, maxDepth: 14, fail: new Set(), deadline: deadline || Infinity });
  }

  // 한 방향 등급(놓인 돌 기준이 아니라 빈칸 q에 c를 놓을 때)
  function dirLevel(ctx, q, c, d) {
    const b = ctx.b, n = ctx.n, x = q % n, y = (q / n) | 0, dx = DIRS[d][0], dy = DIRS[d][1];
    let cd = 0, k = 0;
    for (let o = -5; o <= 5; o++) {
      if (o === 0) continue;
      const xi = x + o * dx, yj = y + o * dy;
      let v;
      if (xi < 0 || yj < 0 || xi >= n || yj >= n) v = 2;
      else { const s0 = b[yj * n + xi]; v = s0 === 0 ? 0 : s0 === c ? 1 : 2; }
      cd += v * POW[k++];
    }
    return ctx.T[c][cd];
  }
  // 3과 4를 이어 가며 이기는 길 (c가 둘 차례). 성공하면 첫 수
  function vct(ctx, c, S, depth) {
    if (++S.nodes > S.max || Date.now() > S.deadline) { S.out = true; return false; }
    if (depth > S.maxDepth) return false;
    const key = ctx.key() + depth * 0.5;
    if (S.fail.has(key)) return false;
    const b = ctx.b, near = ctx.near, o = 3 - c, N = b.length, n = ctx.n;
    const atk = [];
    for (let i = 0; i < N; i++) {
      if (b[i] || !near[i]) continue;
      const A = evalPt(ctx, i, c);
      if (A.five) { if (depth === 0) S.first = i; return true; }
      if (!A.forb && (A.n6 || A.n5 || A.n4)) atk.push({ i, A });
    }
    for (let i = 0; i < N; i++) if (!b[i] && near[i] && isFivePt(ctx, i, o)) { S.fail.add(key); return false; }
    atk.sort((p, q) => q.A.s - p.A.s);
    for (const m of atk.slice(0, 12)) {
      if (m.A.n6 || m.A.n5 >= 2 || (m.A.n5 && m.A.n4)) { if (depth === 0) S.first = m.i; return true; }
      ctx.place(m.i, c);
      let ok;
      if (m.A.n5) {
        // 4: 막을 자리 하나
        const q = blockPts(ctx, m.i, c)[0];
        if (q == null) ok = false;
        else if (ctx.res[o] && OM.forbiddenRaw(b, n, q % n, (q / n) | 0, o, ctx.rules, 0)) ok = true;
        else { ctx.place(q, o); ok = vct(ctx, c, S, depth + 1); ctx.unplace(q, o); }
      } else {
        // 열린 3: 막는 자리들 + 상대의 4(반격) 모두 견뎌야 함
        const def = new Set();
        const x = m.i % n, y = (m.i / n) | 0;
        for (let d = 0; d < 4; d++) {
          // m에서 이 방향이 열린 3인지
          ctx.unplace(m.i, c);
          const l = dirLevel(ctx, m.i, c, d);
          ctx.place(m.i, c);
          if (l !== 4) continue;
          for (let k = -5; k <= 5; k++) {
            const xi = x + k * DIRS[d][0], yj = y + k * DIRS[d][1];
            if (xi < 0 || yj < 0 || xi >= n || yj >= n) continue;
            const q = yj * n + xi;
            if (!b[q] && dirLevel(ctx, q, c, d) >= 5) def.add(q);
          }
        }
        for (let i = 0; i < N; i++) {
          if (b[i] || !near[i] || def.has(i)) continue;
          const D = evalPt(ctx, i, o);
          if (!D.forb && (D.n5 || D.n6)) def.add(i);
        }
        ok = def.size > 0;
        for (const q of def) {
          if (ctx.res[o] && OM.forbiddenRaw(b, n, q % n, (q / n) | 0, o, ctx.rules, 0)) continue;
          ctx.place(q, o);
          let r;
          // 상대가 4로 반격했으면 내가 막아야 함
          const five = blockPts(ctx, q, o);
          if (five.length >= 2) r = false;
          else if (five.length === 1) {
            const z = five[0];
            if (ctx.res[c] && OM.forbiddenRaw(b, n, z % n, (z / n) | 0, c, ctx.rules, 0)) r = false;
            else { ctx.place(z, c); r = vct(ctx, c, S, depth + 1); ctx.unplace(z, c); }
          } else r = vct(ctx, c, S, depth + 1);
          ctx.unplace(q, o);
          if (!r) { ok = false; break; }
        }
      }
      ctx.unplace(m.i, c);
      if (S.out) return false;
      if (ok) { if (depth === 0) S.first = m.i; return true; }
    }
    S.fail.add(key);
    return false;
  }
  function findVCT(ctx, c, maxNodes, deadline, maxDepth) {
    const S = { nodes: 0, max: maxNodes, maxDepth: maxDepth || 6, fail: new Set(), deadline, out: false, first: null };
    const ok = vct(ctx, c, S, 0);
    return ok ? S.first : null;
  }

  const LEVELS = { low: '초급', mid: '중급', high: '고급' };

  // opt: {board, n, rules, color, level, time(ms), rand}
  function think(opt) {
    const t0 = Date.now();
    const rand = opt.rand || Math.random;
    const rules = OM.makeRules(opt.rules);
    const n = rules.size, c = opt.color, o = 3 - c;
    const ctx = new Ctx(opt.board, n, rules);
    const level = opt.level || 'mid';
    const time = opt.time || (level === 'high' ? 1500 : 400);
    const done = (move, why) => ({ move, why, ms: Date.now() - t0 });
    const mid = ((n / 2) | 0) * n + ((n / 2) | 0);

    if (ctx.stones === 0) {
      if (level === 'low' && rand() < 0.5) {
        const dx = Math.floor(rand() * 3) - 1, dy = Math.floor(rand() * 3) - 1;
        return done(mid + dy * n + dx, '첫 수');
      }
      return done(mid, '첫 수');
    }
    const list = gen(ctx, c);
    const playable = list.filter(m => !m.A.forb);
    if (!playable.length) {
      for (let i = 0; i < n * n; i++) if (!ctx.b[i] && !OM.forbiddenRaw(ctx.b, n, i % n, (i / n) | 0, c, rules, 0)) return done(i, '둘 곳 찾기');
      return done(-1, '둘 곳 없음');
    }
    const win = playable.find(m => m.A.five);
    if (win) return done(win.i, '오목 완성');
    const oppFive = playable.filter(m => m.D.five);

    if (level === 'low') {
      if (oppFive.length && rand() < 0.9) return done(oppFive[0].i, '4 막기');
      let best = null, bv = -Infinity;
      for (const m of playable.slice(0, 10)) {
        const dv = m.D.forb ? 0 : m.D.s;
        const v = (Math.min(m.A.s, 3e5) + 0.45 * Math.min(dv, 3e5)) * (0.55 + rand() * 0.9);
        if (v > bv) { bv = v; best = m; }
      }
      return done(best.i, '느낌대로');
    }

    if (oppFive.length) return done(oppFive[0].i, '4 막기');
    const sure = playable.find(m => m.A.n6 || m.A.n5 >= 2);
    if (sure) return done(sure.i, sure.A.n6 ? '열린 4' : '4-4');

    if (level === 'mid') {
      const cands = playable.slice(0, 10);
      const r = rootSearch(ctx, c, cands, 2, 8, t0 + time);
      // 가끔은 비슷한 다른 수
      if (rand() < 0.2 && cands.length > 1 && cands[1].sc > cands[0].sc * 0.8 && Math.abs(r.val) < 1e5) return done(cands[1].i, '두 수 앞');
      return done(r.move, '두 수 앞');
    }

    // 고급
    const deadline = t0 + time;
    const mine = findVCF(ctx, c, 30000, t0 + time * 0.25);
    if (mine) return done(mine[0], '연속 4로 끝내기');
    const myT = findVCT(ctx, c, 20000, t0 + time * 0.4, 6);
    if (myT != null) return done(myT, '3·4로 몰아붙이기');
    let cands = playable.slice(0, 14);
    for (const m of playable) if (m.A.n5 && !cands.includes(m)) cands.push(m);
    const oppThreat = () => findVCF(ctx, o, 3000, t0 + time * 0.75) || findVCT(ctx, o, 1500, t0 + time * 0.75, 4) != null;
    const theirs = oppThreat();
    if (theirs) {
      const keep = [];
      for (const m of cands) {
        ctx.place(m.i, c);
        const still = oppThreat();
        ctx.unplace(m.i, c);
        if (!still) keep.push(m);
        if (Date.now() > t0 + time * 0.75) break;
      }
      if (keep.length) cands = keep;
    }
    const r = rootSearch(ctx, c, cands, 10, 9, deadline);
    return done(r.move, theirs ? '상대 공격 막기' : '깊이 ' + r.depth + '수 읽기');
  }

  const OMAI = { think, table, evalPt, gen, findVCF, findVCT, Ctx, LEVELS };
  root.OMAI = OMAI;
  if (typeof module !== 'undefined' && module.exports) module.exports = OMAI;
})(typeof self !== 'undefined' ? self : this);

</script>

    const turnC = G.g.turn;
    let txt = '';
    if (R.deadline) {
      const left = Math.max(0, R.deadline - now), sec = Math.ceil(left / 1000);
      const pct = Math.max(0, Math.min(100, left / (R.settings.turnSec * 1000) * 100));
      const bar = document.querySelector(`.pl[data-c="${turnC}"] .bar`);
      if (bar) { bar.style.width = pct + '%'; bar.classList.toggle('low', sec <= 5); }
      txt = ` · 남은 시간 ${sec}초`;
      if (turnC === G.me && sec <= 5 && sec > 0 && sec !== NET.lastTick) { NET.lastTick = sec; sound('tick'); }
    }
    const oppSeat = R.seats[1 - NET.seat];
    if (oppSeat && oppSeat.kind === 'human' && !oppSeat.online && oppSeat.offAt) {
      const left = Math.max(0, Math.ceil((oppSeat.offAt + R.goneMs - now) / 1000));
      txt += ` · 상대 연결 끊김, ${left}초 뒤 내 승리`;
    }
    if (clock) clock.textContent = txt;
  }
  setInterval(tick, 250);

  // 자동 시험용 (읽기만)
  window.__omok = { get room() { return NET.room; }, get seat() { return NET.seat; }, get moves() { return G ? G.g.moves.slice() : null; }, get rules() { return G ? G.g.rules : null; }, get turn() { return G ? G.g.turn : 0; }, get me() { return G ? G.me : 0; } };

  /* ── 처음 열 때 ── */
  drawSetup();
  const hash = (location.hash.match(/^#(\d{6})$/) || [])[1];
  const savedRoom = lsGet(ROOM_KEY);
  if (SERVER && hash) {
    set.mode = 'online'; drawSetup(); $('joinCode').value = hash;
    if (set.name) enter(hash); else onMsg('초대받은 방이에요. 이름을 적고 들어가기를 눌러요.');
  } else if (SERVER && savedRoom && /^\d{6}$/.test(savedRoom)) {
    set.mode = 'online'; drawSetup(); enter(savedRoom);
  } else if (!SERVER && hash) {
    set.mode = 'online'; drawSetup();
  }
})();
</script>
